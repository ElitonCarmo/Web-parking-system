<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start" (click)="Voltar()">
      <ion-icon size="large" name="arrow-round-back"></ion-icon>
    </ion-buttons>

    <ion-title>
      Mensalista Detalhado
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <!-- Item Labels -->
  <ion-item>
    <ion-label>Cliente: {{Item.Nome}}, CPF: {{Item.CPF}}</ion-label>
  </ion-item>

  <ion-item>
    <ion-label>Mensalidade: #{{Item.Codigo}}, Situação: A Pagar</ion-label>
  </ion-item>

  <ion-item>
    <ion-label>Data de Vencimento: {{Item.DataVencimento}}</ion-label>
  </ion-item>

  <ion-item>
    <ion-label>Valor a Pagar: {{Item.ValorAPagar}}</ion-label>
  </ion-item>

  <ion-item>
    <ion-label>Data de Pagamento: {{Item.DataPagamento}}</ion-label>
  </ion-item>

  <ion-item>
    <ion-label>Valor Pago: {{Item.ValorPago}}</ion-label>
  </ion-item>


</ion-content>
